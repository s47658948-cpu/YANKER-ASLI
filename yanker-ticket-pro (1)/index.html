<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YANKER // SUNSET CITY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700;800&display=swap');

:root{
  --bg:#050810;
  --bg2:#080e1c;
  --panel:rgba(17,27,53,0.55);
  --panel-solid:#0c1428;
  --border:rgba(96,140,255,0.16);
  --border-strong:rgba(96,140,255,0.38);
  --blue-1:#13245e;
  --blue-2:#2f5bff;
  --blue-3:#7aa2ff;
  --blue-glow:rgba(47,91,255,0.45);
  --text:#e9edff;
  --text-dim:#96a2c9;
  --text-faint:#5c6690;
  --danger:#ff5c7c;
  --success:#31e2a0;
  --warn:#ffb545;
  --radius:18px;
  --radius-sm:10px;
  --font-d:'Rajdhani','Vazirmatn',sans-serif;
  --font-b:'Vazirmatn',sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(47,91,255,0.20), transparent 60%),
    radial-gradient(900px 500px at -10% 20%, rgba(47,91,255,0.12), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--font-b);
  min-height:100vh;
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(96,140,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(96,140,255,0.05) 1px, transparent 1px);
  background-size:42px 42px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 0%, #000 40%, transparent 100%);
  pointer-events:none;
  z-index:0;
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::selection{background:var(--blue-2);color:#fff;}
:focus-visible{outline:2px solid var(--blue-3); outline-offset:2px; border-radius:4px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
}

.wrap{max-width:1180px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}

/* NAV */
.nav{
  position:sticky;top:0;z-index:50;
  backdrop-filter:blur(14px);
  background:rgba(5,8,16,0.72);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1180px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px;}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-d);font-weight:700;font-size:22px;letter-spacing:1px;cursor:pointer;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--blue-2),var(--blue-1));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 22px var(--blue-glow);
  font-family:var(--font-d);font-weight:700;font-size:16px;
}
.brand-sub{font-size:10px;letter-spacing:3px;color:var(--text-faint);font-family:var(--font-d);font-weight:600;margin-inline-start:2px;}
.nav-links{display:flex;gap:6px;align-items:center;flex-wrap:wrap;}
.nav-links a{
  padding:8px 14px;border-radius:999px;font-size:14px;color:var(--text-dim);
  transition:.2s;border:1px solid transparent;
}
.nav-links a:hover{color:var(--text);background:rgba(96,140,255,0.08);border-color:var(--border);}
.nav-links a.active{color:#fff;background:rgba(47,91,255,0.18);border-color:var(--border-strong);}
.nav-cta{display:flex;gap:8px;}
.hamburger{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:8px;width:40px;height:40px;align-items:center;justify-content:center;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 22px;border-radius:999px;border:1px solid var(--border-strong);
  font-size:14px;font-weight:600;color:var(--text);background:rgba(96,140,255,0.06);
  transition:.25s;white-space:nowrap;
}
.btn:hover{background:rgba(96,140,255,0.14);box-shadow:0 0 24px rgba(47,91,255,0.25);transform:translateY(-1px);}
.btn-primary{
  background:linear-gradient(135deg,var(--blue-2),#1c3fae);
  border-color:rgba(122,162,255,0.5);color:#fff;
  box-shadow:0 4px 24px rgba(47,91,255,0.35);
}
.btn-primary:hover{box-shadow:0 6px 32px rgba(47,91,255,0.55);}
.btn-ghost{background:transparent;border-color:var(--border);}
.btn-danger{border-color:rgba(255,92,124,0.5);color:#ffb3c2;}
.btn-danger:hover{background:rgba(255,92,124,0.12);box-shadow:0 0 20px rgba(255,92,124,0.25);}
.btn-success{border-color:rgba(49,226,160,0.5);color:#9df5d3;}
.btn-success:hover{background:rgba(49,226,160,0.12);}
.btn-sm{padding:7px 14px;font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none !important;box-shadow:none !important;}

/* HERO */
.hero{padding:86px 0 60px;position:relative;}
.hero-grid{display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;align-items:center;}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;font-family:var(--font-d);font-weight:600;
  font-size:12.5px;letter-spacing:3px;color:var(--blue-3);text-transform:uppercase;
  padding:6px 14px;border:1px solid var(--border-strong);border-radius:999px;background:rgba(47,91,255,0.08);
  margin-bottom:22px;
}
.eyebrow-dot{width:6px;height:6px;border-radius:50%;background:var(--success);box-shadow:0 0 10px var(--success);animation:pulse-dot 1.6s infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;}50%{opacity:.35;}}
.hero h1{
  font-family:var(--font-d);font-weight:700;font-size:clamp(52px,8vw,96px);line-height:0.95;
  margin:0 0 18px;letter-spacing:1px;
  background:linear-gradient(180deg,#fff 30%, var(--blue-3) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 60px rgba(47,91,255,0.25);
}
.hero h1 span{display:block;font-size:0.32em;letter-spacing:8px;color:var(--text-faint);-webkit-text-fill-color:var(--text-faint);margin-top:6px;font-weight:600;}
.hero p{font-size:16.5px;line-height:1.9;color:var(--text-dim);max-width:520px;margin:0 0 30px;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:38px;}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;}
.hero-stat b{display:block;font-family:var(--font-d);font-size:26px;font-weight:700;color:#fff;}
.hero-stat span{font-size:12px;color:var(--text-faint);letter-spacing:1px;}

/* SIGNAL WIDGET */
.signal{
  position:relative;width:340px;max-width:100%;margin-inline-start:auto;
  background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:26px;
  backdrop-filter:blur(16px);
  box-shadow:0 20px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
}
.signal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
.signal-title{font-family:var(--font-d);font-size:13px;letter-spacing:2px;color:var(--text-faint);font-weight:600;}
.signal-live{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--success);font-weight:600;}
.radar{
  position:relative;width:180px;height:180px;margin:0 auto 18px;border-radius:50%;
  border:1px solid var(--border-strong);
  background:radial-gradient(circle at center, rgba(47,91,255,0.08), transparent 70%);
}
.radar::before{
  content:"";position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg, rgba(47,91,255,0.55), transparent 30%);
  animation:spin 3.2s linear infinite;
  mask-image:radial-gradient(circle, transparent 30%, black 31%);
  -webkit-mask-image:radial-gradient(circle, transparent 30%, black 31%);
}
.radar::after{content:"";position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle, var(--blue-3), var(--blue-2));box-shadow:0 0 30px var(--blue-glow);}
@keyframes spin{to{transform:rotate(360deg);}}
.radar-ring{position:absolute;border:1px solid rgba(96,140,255,0.18);border-radius:50%;}
.radar-num{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;z-index:2;
}
.radar-num b{display:block;font-family:var(--font-d);font-size:30px;font-weight:700;color:#fff;}
.radar-num span{font-size:9.5px;letter-spacing:2px;color:var(--text-faint);}
.signal-feed{border-top:1px solid var(--border);padding-top:14px;margin-top:4px;}
.feed-item{display:flex;gap:8px;font-size:12px;color:var(--text-dim);padding:6px 0;align-items:flex-start;}
.feed-dot{width:5px;height:5px;border-radius:50%;background:var(--blue-3);margin-top:6px;flex-shrink:0;}
.feed-empty{font-size:12px;color:var(--text-faint);padding:6px 0;}

/* SECTIONS */
.section{padding:64px 0;}
.section-head{margin-bottom:36px;}
.section-eyebrow{font-family:var(--font-d);font-size:12px;letter-spacing:3px;color:var(--blue-3);font-weight:600;margin-bottom:8px;}
.section-title{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:0.5px;margin:0;}
.section-desc{color:var(--text-dim);font-size:14.5px;margin-top:8px;max-width:560px;line-height:1.8;}

.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr;}}

.card{
  background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:24px;
  backdrop-filter:blur(12px);transition:.25s;position:relative;overflow:hidden;
}
.card:hover{border-color:var(--border-strong);box-shadow:0 12px 40px rgba(47,91,255,0.14);transform:translateY(-3px);}
.card-icon{
  width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(47,91,255,0.25),rgba(47,91,255,0.05));
  border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:16px;
}
.card h3{font-family:var(--font-d);font-size:18px;font-weight:700;margin:0 0 8px;}
.card p{font-size:13.5px;color:var(--text-dim);line-height:1.8;margin:0;}

.rule-card{display:flex;gap:14px;align-items:flex-start;}
.rule-num{font-family:var(--font-d);font-size:26px;font-weight:700;color:var(--blue-3);opacity:.55;flex-shrink:0;width:34px;}
.rule-text{font-size:14.5px;color:var(--text);line-height:1.8;padding-top:2px;}

/* MEMBERS */
.member-card{text-align:center;padding:22px 18px;}
.avatar{width:76px;height:76px;border-radius:18px;margin:0 auto 14px;overflow:hidden;border:1px solid var(--border-strong);background:var(--blue-1);position:relative;}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.status-dot{position:absolute;bottom:-2px;left:-2px;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg2);}
.status-online{background:var(--success);box-shadow:0 0 8px var(--success);}
.status-offline{background:var(--text-faint);}
.member-name{font-family:var(--font-d);font-weight:700;font-size:15.5px;margin-bottom:4px;}
.member-rank{display:inline-block;font-size:11px;padding:3px 10px;border-radius:999px;background:rgba(47,91,255,0.14);border:1px solid var(--border);color:var(--blue-3);letter-spacing:.5px;}
.member-status-text{font-size:11px;color:var(--text-faint);margin-top:8px;}

/* ANNOUNCEMENTS */
.ann-card{padding:22px;}
.ann-date{font-size:11px;color:var(--text-faint);letter-spacing:1px;margin-bottom:10px;font-family:var(--font-d);}
.ann-title{font-family:var(--font-d);font-weight:700;font-size:19px;margin:0 0 10px;}
.ann-body{font-size:14px;color:var(--text-dim);line-height:1.85;}
.ann-author{margin-top:14px;font-size:11.5px;color:var(--text-faint);border-top:1px solid var(--border);padding-top:12px;}

/* FORMS */
.auth-shell{max-width:440px;margin:70px auto;padding:0 24px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:32px;backdrop-filter:blur(14px);}
.panel-title{font-family:var(--font-d);font-size:26px;font-weight:700;margin:0 0 6px;}
.panel-sub{font-size:13px;color:var(--text-dim);margin-bottom:26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--text-dim);margin-bottom:7px;letter-spacing:.3px;}
.field input, .field textarea, .field select{
  width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--border);
  background:rgba(5,10,22,0.6);color:var(--text);font-size:14px;transition:.2s;
}
.field input:focus, .field textarea:focus, .field select:focus{border-color:var(--border-strong);background:rgba(5,10,22,0.85);}
.field textarea{resize:vertical;min-height:90px;}
.field-row{display:flex;gap:12px;}
.field-row .field{flex:1;}
.check-row{display:flex;align-items:flex-start;gap:10px;font-size:13px;color:var(--text-dim);margin:18px 0;line-height:1.7;}
.check-row input{margin-top:3px;}
.error-text{color:var(--danger);font-size:12.5px;margin-top:6px;}
.msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:18px;border:1px solid;}
.msg-error{background:rgba(255,92,124,0.08);border-color:rgba(255,92,124,0.35);color:#ffb3c2;}
.msg-success{background:rgba(49,226,160,0.08);border-color:rgba(49,226,160,0.35);color:#9df5d3;}
.msg-info{background:rgba(47,91,255,0.08);border-color:var(--border-strong);color:var(--blue-3);}
.switch-line{text-align:center;margin-top:18px;font-size:13px;color:var(--text-dim);}
.switch-line a{color:var(--blue-3);font-weight:600;}

/* STATUS BADGES */
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 12px;border-radius:999px;font-weight:600;letter-spacing:.3px;}
.badge-pending{background:rgba(255,181,69,0.12);color:var(--warn);border:1px solid rgba(255,181,69,0.35);}
.badge-approved{background:rgba(49,226,160,0.12);color:var(--success);border:1px solid rgba(49,226,160,0.35);}
.badge-rejected{background:rgba(255,92,124,0.12);color:var(--danger);border:1px solid rgba(255,92,124,0.35);}

/* ADMIN */
.admin-shell{display:grid;grid-template-columns:230px 1fr;gap:24px;padding:36px 0 80px;align-items:start;}
@media(max-width:900px){.admin-shell{grid-template-columns:1fr;}}
.admin-side{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:16px;position:sticky;top:88px;}
.admin-side button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:right;padding:11px 14px;border-radius:10px;
  background:none;border:none;color:var(--text-dim);font-size:14px;margin-bottom:4px;transition:.2s;
}
.admin-side button:hover{background:rgba(96,140,255,0.08);color:var(--text);}
.admin-side button.active{background:rgba(47,91,255,0.16);color:#fff;border:1px solid var(--border-strong);}
.admin-main{min-width:0;}
.stat-card{padding:20px;}
.stat-card b{display:block;font-family:var(--font-d);font-size:30px;font-weight:700;}
.stat-card span{font-size:12px;color:var(--text-faint);}
.table-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px;}
th{text-align:right;padding:14px 16px;color:var(--text-faint);font-size:11.5px;letter-spacing:1px;border-bottom:1px solid var(--border);font-weight:600;}
td{padding:14px 16px;border-bottom:1px solid var(--border);color:var(--text-dim);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.row-actions{display:flex;gap:8px;flex-wrap:wrap;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text-faint);}
.empty-state .em-icon{font-size:34px;margin-bottom:12px;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.bar-label{width:110px;font-size:12.5px;color:var(--text-dim);flex-shrink:0;}
.bar-track{flex:1;height:8px;border-radius:99px;background:rgba(96,140,255,0.1);overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--blue-1),var(--blue-2));border-radius:99px;}
.bar-val{width:34px;text-align:left;font-size:12px;color:var(--text-faint);}
.modal-bg{position:fixed;inset:0;background:rgba(3,5,12,0.75);backdrop-filter:blur(4px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--panel-solid);border:1px solid var(--border-strong);border-radius:var(--radius);padding:28px;max-width:480px;width:100%;max-height:85vh;overflow-y:auto;}
.modal h3{font-family:var(--font-d);font-size:20px;margin:0 0 6px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
.pill{font-size:11.5px;padding:4px 10px;border-radius:999px;background:rgba(96,140,255,0.08);border:1px solid var(--border);color:var(--text-dim);}
.close-x{position:absolute;top:16px;left:16px;background:none;border:1px solid var(--border);color:var(--text-dim);width:30px;height:30px;border-radius:8px;}

/* FOOTER */
.footer{border-top:1px solid var(--border);padding:48px 0 32px;margin-top:40px;}
.footer-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px;margin-bottom:36px;}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr 1fr;}}
.footer h4{font-family:var(--font-d);font-size:13px;letter-spacing:1.5px;color:var(--text-faint);margin:0 0 14px;}
.footer a{display:block;font-size:13.5px;color:var(--text-dim);margin-bottom:10px;transition:.2s;}
.footer a:hover{color:var(--blue-3);}
.footer-bottom{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;padding-top:24px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text-faint);}

.banner{background:linear-gradient(90deg, rgba(47,91,255,0.14), rgba(47,91,255,0.04));border:1px solid var(--border-strong);border-radius:14px;padding:14px 18px;font-size:13px;color:var(--blue-3);display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 0;flex-wrap:wrap;}
.hint{font-size:12px;color:var(--text-faint);margin-top:8px;}
.page-head{padding:70px 0 30px;}
.center-hint{text-align:center;padding:70px 20px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
window.YANKER_API = "/.netlify/functions/api";
async function yankerApi(action, method="GET", body=null){
  let url = window.YANKER_API+"?action="+encodeURIComponent(action);
  if(action === "my-status" && typeof STATE !== "undefined" && STATE.user && STATE.user.username){
    url += "&username=" + encodeURIComponent(STATE.user.username);
  }
  const r = await fetch(url,{
    method,
    headers:{"content-type":"application/json"},
    body:body ? JSON.stringify(body) : undefined
  });
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "خطا در ارتباط با سرور");
  return d;
}
</script>
<script>
/* =========================================================
   YANKER // SUNSET CITY — front-end app with persistent storage
   acting as the site's database (users, members, requests,
   announcements, rules, activity log).
   ========================================================= */

const DEFAULT_RULES = [
  "داشتن سن شهری بالای ۷ سال",
  "داشتن سن واقعی بالای ۱۴ سال",
  "انجام حداقل ۳ کوئست روزانه",
  "حضور در کپچرهای روزانه",
  "احترام کامل به اعضا",
  "داشتن حداقل ۱۵ ساعت Play Time در هفته"
];

const ROLE_LEVEL = { user:0, member:1, moderator:2, admin:3, owner:4 };
const ROLE_LABEL = { user:"کاربر", member:"عضو", moderator:"مدیر ارشد", admin:"ادمین", owner:"مالک" };

let STATE = {
  route: (location.hash || "#/home").replace("#",""),
  user: null,
  users: [],
  members: [],
  requests: [],
  announcements: [],
  rules: [],
  activity: [],
  tickets: [],
  loaded: false,
  adminTab: "overview",
  authError: "",
  authNotice: "",
  joinError: "",
  joinSuccess: false,
  banner: true
};

/* ---------- storage helpers ---------- */
async function getJSON(key, shared, fallback){
  try{
    const raw = localStorage.getItem("yanker_" + key);
    return raw !== null ? JSON.parse(raw) : fallback;
  }catch(e){
    console.error("localStorage get failed", e);
    return fallback;
  }
}
async function setJSON(key, shared, value){
  try{
    localStorage.setItem("yanker_" + key, JSON.stringify(value));
    return true;
  }catch(e){
    console.error("localStorage set failed", e);
    return false;
  }
}

async function sha256(str){
  const enc = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function fmtDate(ts){
  try{ return new Date(ts).toLocaleString("fa-IR",{dateStyle:"medium",timeStyle:"short"}); }
  catch(e){ return ""; }
}
function avatarUrl(seed){
  return "https://api.dicebear.com/7.x/adventurer/svg?seed=" + encodeURIComponent(seed) + "&backgroundType=gradientLinear&backgroundColor=13245e,2f5bff";
}

/* ---------- bootstrap ---------- */
async function loadAll(){
  const [users, localAnnouncements, rules, activity, session, apiMembers, apiAnnouncements] = await Promise.all([
    getJSON("yanker_users", true, null),
    getJSON("yanker_announcements", true, null),
    getJSON("yanker_rules", true, null),
    getJSON("yanker_activity", true, null),
    getJSON("yanker_session", false, null),
    yankerApi("members").catch(()=>({members:[]})),
    yankerApi("announcements").catch(()=>({announcements:[]}))
  ]);

  STATE.rules = rules || DEFAULT_RULES.slice();
  if(!rules) await setJSON("yanker_rules", true, STATE.rules);

  const OWNER_USERNAME = "owner";
  const OWNER_PASSWORD = "Yanker@Admin#2026";
  const EMPTY_HASH = await sha256("");

  if(!users){
    const ownerHash = await sha256(OWNER_PASSWORD);
    STATE.users = [{
      id: uid(), username:OWNER_USERNAME, displayName:"Founder", role:"owner",
      passwordHash: ownerHash, createdAt: Date.now()
    }];
    await setJSON("yanker_users", true, STATE.users);
  } else {
    STATE.users = users;
    let owner = STATE.users.find(u => u.username === OWNER_USERNAME);
    if(!owner){
      owner = {
        id: uid(), username:OWNER_USERNAME, displayName:"Founder", role:"owner",
        passwordHash: await sha256(OWNER_PASSWORD), createdAt: Date.now()
      };
      STATE.users.push(owner);
      await saveUsers();
    } else if(owner.role === "owner" && (!owner.passwordHash || owner.passwordHash === EMPTY_HASH)){
      owner.passwordHash = await sha256(OWNER_PASSWORD);
      await saveUsers();
    }
  }

  // Members are now loaded only from the real Supabase API.
  // This removes the old demo/fake member seed and prevents stale localStorage
  // members from appearing on the public site.
  STATE.members = (apiMembers.members || []).map(m=>({
    id:m.id, name:m.name, username:m.username, discord:m.discord, rank:m.rank || "Recruit",
    status:m.status || "online", joinedAt:m.joinedAt, seed:m.name, userId:m.username
  }));
  try { localStorage.removeItem("yanker_members"); } catch(e) {}

  // Announcements are now persisted in Supabase. Old local demo announcements are removed.
  STATE.announcements = (apiAnnouncements.announcements || []).map(a=>({
    id:a.id,title:a.title,body:a.body,author:a.author,date:a.date,published:a.published
  }));
  try { localStorage.removeItem("yanker_announcements"); } catch(e) {}

  STATE.activity = activity || [];

  if(session && session.username){
    const u = (STATE.users||[]).find(u=>u.username===session.username);
    if(u) STATE.user = u;
  }

  STATE.loaded = true;
  if(STATE.user) { setTimeout(()=>refreshMyStatus(), 0); setTimeout(()=>refreshTickets(), 0); }
  try { window.addEventListener('hashchange', ()=>{ if(STATE.route==='tickets') refreshTickets(); }); } catch(e) {}
}

async function refreshMyStatus(){
  if(!STATE.user || !STATE.user.username) return;
  try{
    const r = await yankerApi("my-status","GET",null);
    const nextRequests = (r.requests||[]).map(x=>({
      id:x.id, username:x.username, displayName:x.name, discord:x.discord,
      cityAge:x.cityAge, realAge:x.realAge, playtime:x.playtime, reason:x.reason,
      status:x.status, createdAt:x.createdAt, reviewedBy:x.reviewedBy, reviewedAt:x.reviewedAt
    }));

    const oldStatus = JSON.stringify(STATE.requests);
    const oldRank = STATE.members.find(x=>x.username===STATE.user.username)?.rank || null;
    STATE.requests = nextRequests;

    if(r.member){
      const m={id:r.member.id,name:r.member.name,username:r.member.username,rank:r.member.rank,status:r.member.status||"online",joinedAt:r.member.joinedAt,seed:r.member.name,userId:r.member.username};
      STATE.members = [m, ...STATE.members.filter(x=>x.id!==m.id && x.username!==m.username)];
      if(STATE.user.role === "user") STATE.user.role = "member";
    }

    const newRank = r.member?.rank || null;
    const changed = oldStatus !== JSON.stringify(STATE.requests) || oldRank !== newRank;

    // Never re-render the join form while the user is typing. A background
    // status refresh must not steal focus or clear input values.
    if(changed && STATE.route === "profile") render();
  }catch(e){ console.warn("my-status sync failed",e); }
}
async function refreshTickets(){
  if(!STATE.user || !STATE.user.username) return;
  try{
    const r=await yankerApi("tickets");
    STATE.tickets=r.tickets||[];
    const latest=STATE.tickets.reduce((max,t)=>Math.max(max,Number(t.createdAt||0)),0);
    if(latest && Date.now()-latest<10000) ticketCooldownUntil=Math.max(ticketCooldownUntil,latest+10000);
  }catch(e){ console.warn("ticket sync failed",e); }
}
let ticketCooldownUntil=0;
async function createTicket(e){
  e.preventDefault();
  const f=e.target, subject=f.subject.value.trim(), message=f.message.value.trim();
  if(!subject||!message) return;
  const button=f.querySelector('button[type="submit"]');
  if(Date.now()<ticketCooldownUntil){ updateTicketCooldown(button); return; }
  try{
    await yankerApi("ticket-create","POST",{username:STATE.user.username,name:STATE.user.displayName,subject,message});
    ticketCooldownUntil=Date.now()+10000;
    await refreshTickets();
    f.reset();
    render();
    setTimeout(()=>render(),10050);
  }catch(err){
    if(err?.message?.includes("ثانیه")){ const m=err.message.match(/(\d+)\s*ثانیه/); if(m) ticketCooldownUntil=Date.now()+Number(m[1])*1000; }
    alert(err.message);
    render();
  }
}
function updateTicketCooldown(button){
  if(!button) return;
  const left=Math.max(0,Math.ceil((ticketCooldownUntil-Date.now())/1000));
  button.disabled=left>0; button.textContent=left>0?`ارسال مجدد تا ${left} ثانیه`:'ارسال تیکت';
  if(left>0) setTimeout(()=>updateTicketCooldown(button),1000);
}

  try{ await yankerApi("ticket-delete-own","POST",{id,username:STATE.user.username}); await refreshTickets(); render(); }catch(e){ alert(e.message); }

async function handleRegister(e){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim().toLowerCase();
  const displayName = f.displayName.value.trim();
  const password = f.password.value;
  const confirm = f.confirm.value;

  if(!/^[a-z0-9_]{3,20}$/.test(username)){ STATE.authError = "نام کاربری باید ۳ تا ۲۰ حرف انگلیسی/عدد/آندرلاین باشد."; render(); return; }
  if(!displayName){ STATE.authError = "نام نمایشی را وارد کنید."; render(); return; }
  if(password.length < 6){ STATE.authError = "رمز عبور باید حداقل ۶ کاراکتر باشد."; render(); return; }
  if(password !== confirm){ STATE.authError = "رمز عبور و تکرار آن یکسان نیستند."; render(); return; }
  if(STATE.users.find(u=>u.username===username)){ STATE.authError = "این نام کاربری قبلاً ثبت شده است."; render(); return; }

  const passwordHash = await sha256(password);
  const newUser = { id: uid(), username, displayName, role:"user", passwordHash, createdAt: Date.now() };
  STATE.users.push(newUser);
  await saveUsers();
  STATE.user = newUser;
  await setJSON("yanker_session", false, { username });
  logActivity(`${esc(displayName)} به سایت پیوست (ثبت‌نام)`);
  nav("profile");
}

async function handleLogin(e){
  e.preventDefault();
  const f = e.target;
  const username = f.username.value.trim().toLowerCase();
  const password = f.password.value;
  const hash = await sha256(password);
  const u = STATE.users.find(u=>u.username===username);
  if(!u || u.passwordHash !== hash){ STATE.authError = "نام کاربری یا رمز عبور اشتباه است."; render(); return; }
  STATE.user = u;
  await setJSON("yanker_session", false, { username });
  nav("profile");
  refreshMyStatus();
}

  await setJSON("yanker_session", false, null);

}

/* ---------- join request ---------- */
async function handleJoinSubmit(e){
  e.preventDefault();
  if(!STATE.user){
    STATE.authNotice = "برای ارسال درخواست عضویت ابتدا وارد حساب کاربری خود شوید.";
    nav("login");
    return;
  }

  const f = e.target;
  const cityAge = Number(f.cityAge.value);
  const realAge = Number(f.realAge.value);
  const playtime = Number(f.playtime.value);
  const reason = f.reason.value.trim();
  const discord = f.discord.value.trim();
  const agree = f.agree.checked;

  if(!discord){ STATE.joinError="آیدی دیسکورد را وارد کنید."; render(); return; }
  if(!cityAge || cityAge<7){ STATE.joinError="سن شهری باید حداقل ۷ سال باشد."; render(); return; }
  if(!realAge || realAge<14){ STATE.joinError="سن واقعی باید حداقل ۱۴ سال باشد."; render(); return; }
  if(!playtime || playtime<0){ STATE.joinError="ساعت بازی هفتگی را وارد کنید."; render(); return; }
  if(reason.length<15){ STATE.joinError="لطفاً دلیل عضویت را کامل‌تر بنویسید (حداقل ۱۵ کاراکتر)."; render(); return; }
  if(!agree){ STATE.joinError="برای ادامه باید قوانین را مطالعه و تأیید کنید."; render(); return; }

  try{
    const result = await yankerApi("request","POST",{
      name: STATE.user.displayName,
      username: STATE.user.username,
      discord,
      cityAge,
      realAge,
      playtime,
      reason,
      passwordHash: STATE.user.passwordHash || ""
    });

    // Keep the current UI in sync without making it the source of truth.
    STATE.requests = STATE.requests.filter(r =>
      !(r.username===STATE.user.username && r.status==="pending")
    );
    STATE.requests.unshift(result.request);
    STATE.joinSuccess = true;
    STATE.joinError = "";
    render();
    refreshMyStatus();
  }catch(err){
    STATE.joinSuccess = false;
    STATE.joinError = err.message;
    render();
  }
}

function viewTickets(){
  if(!STATE.user) return `<div class="center-hint"><p>برای ارتباط با مدیریت ابتدا وارد شوید.</p><button class="btn btn-primary" onclick="nav('login')">ورود</button></div>`;
  const tickets=STATE.tickets||[];
  const openCount=tickets.filter(t=>t.status!=='closed').length;
  const answeredCount=tickets.filter(t=>t.status==='answered').length;
  const cooldown=Math.max(0,Math.ceil((ticketCooldownUntil-Date.now())/1000));
  return `<div class="ticket-page">
    <div class="ticket-hero wrap">
      <div><div class="section-eyebrow">YANKER SUPPORT CENTER</div><h2 class="ticket-title">مرکز پشتیبانی اختصاصی</h2><p class="ticket-subtitle">ارتباط مستقیم و مرتب با مدیریت؛ هر موضوع را در یک تیکت جداگانه پیگیری کن.</p></div>
      <div class="ticket-orb">🎫<span>SUPPORT</span></div>
    </div>
    <div class="wrap">
      <div class="ticket-stats">
        <div class="ticket-stat"><b>${tickets.length}</b><span>کل تیکت‌ها</span></div>
        <div class="ticket-stat"><b>${openCount}</b><span>باز</span></div>
        <div class="ticket-stat"><b>${answeredCount}</b><span>پاسخ داده شده</span></div>
        <div class="ticket-stat"><b>10s</b><span>فاصله ارسال</span></div>
      </div>
      <div class="ticket-layout">
        <div class="ticket-compose card">
          <div class="ticket-section-head"><div><span class="ticket-kicker">NEW REQUEST</span><h3>ایجاد تیکت جدید</h3></div><div class="ticket-icon">✦</div></div>
          <p class="hint">موضوع را واضح بنویس تا مدیریت سریع‌تر رسیدگی کند.</p>
          <form onsubmit="createTicket(event)" class="ticket-form">
            <label>موضوع تیکت<input name="subject" maxlength="120" placeholder="مثلاً: مشکل ورود به سرور" required></label>
            <label>پیام<textarea name="message" maxlength="3000" placeholder="جزئیات درخواست یا مشکل خود را بنویسید..." required></textarea></label>
            <div class="ticket-form-foot"><span class="ticket-note">⏱️ بعد از هر ارسال، ۱۰ ثانیه برای تیکت بعدی فاصله است.</span><button class="btn btn-primary ticket-submit" type="submit" ${cooldown?'disabled':''}>${cooldown?`ارسال مجدد تا ${cooldown} ثانیه`:'ارسال تیکت'}</button></div>
          </form>
        </div>
        <div class="ticket-list">
          <div class="ticket-section-head"><div><span class="ticket-kicker">MY CONVERSATIONS</span><h3>گفتگوهای من</h3></div><button class="btn btn-sm btn-ghost" onclick="refreshTickets().then(render)">↻</button></div>
          ${tickets.length?tickets.map(t=>`<div class="ticket-card ${t.status==='answered'?'is-answered':''} ${t.status==='closed'?'is-closed':''}">
            <div class="ticket-card-top"><div><div class="ticket-subject">${esc(t.subject)}</div><div class="hint">${fmtDate(t.createdAt)}</div></div><span class="ticket-status ${t.status}">${t.status==='closed'?'بسته':t.status==='answered'?'پاسخ مدیریت':'در انتظار پاسخ'}</span></div>
            <div class="ticket-thread">${t.messages.map(m=>`<div class="ticket-message ${m.sender==='admin'?'from-admin':'from-user'}"><div class="ticket-avatar">${m.sender==='admin'?'Y':'شما'}</div><div class="ticket-bubble"><div class="ticket-meta"><b>${esc(m.sender==='admin'?'مدیریت':m.senderName)}</b><small>${fmtDate(m.createdAt)}</small></div><div>${esc(m.body)}</div></div></div>`).join('')}</div>
            ${t.status!=='closed'?`<button class="btn btn-sm btn-danger" onclick="deleteTicket('${t.id}')">حذف گفتگو</button>`:''}
          </div>`).join(''):`<div class="ticket-empty"><div class="ticket-empty-icon">◈</div><h3>هنوز گفتگویی ندارید</h3><p>اولین تیکتت را از پنل سمت چپ ارسال کن.</p></div>`}
        </div>
      </div>
    </div>
  </div>`;
}

function statusBadge(s){
  if(s==="approved") return `<span class="badge badge-approved">تأیید شده</span>`;
  if(s==="rejected") return `<span class="badge badge-rejected">رد شده</span>`;
  return `<span class="badge badge-pending">در انتظار بررسی</span>`;
}

function setAdminTab(id){ STATE.adminTab = id; render(); }

function adminTabContent(){
  switch(STATE.adminTab){
    case "overview": return adminOverview();

    case "announcements": return adminAnnouncements();
    case "tickets": return adminTickets();
    case "rules": return adminRules();
    case "activity": return adminActivity();
    case "users": return adminUsers();
    default: return "";
  }
}

function adminOverview(){
  const pending = STATE.requests.filter(r=>r.status==="pending").length;
  const approved = STATE.requests.filter(r=>r.status==="approved").length;
  const rejected = STATE.requests.filter(r=>r.status==="rejected").length;
  const total = STATE.requests.length || 1;
  const rankCounts = {};
  STATE.members.forEach(m=>{ rankCounts[m.rank] = (rankCounts[m.rank]||0)+1; });
  const maxRank = Math.max(1, ...Object.values(rankCounts));

  return `
  <div class="grid-4" style="margin-bottom:22px;">
    <div class="card stat-card"><span>کل کاربران</span><b>${STATE.users.length}</b></div>
    <div class="card stat-card"><span>اعضای رسمی</span><b>${STATE.members.length}</b></div>
    <div class="card stat-card"><span>درخواست در انتظار</span><b style="color:var(--warn);">${pending}</b></div>
    <div class="card stat-card"><span>اطلاعیه‌های منتشرشده</span><b>${STATE.announcements.filter(a=>a.published).length}</b></div>
  </div>
  <div class="grid-2">
    <div class="card">
      <h3 style="margin-bottom:16px;">وضعیت درخواست‌ها</h3>
      <div class="bar-row"><div class="bar-label">تأیید شده</div><div class="bar-track"><div class="bar-fill" style="width:${(approved/total)*100}%;background:linear-gradient(90deg,#155e3f,var(--success));"></div></div><div class="bar-val">${approved}</div></div>
      <div class="bar-row"><div class="bar-label">در انتظار</div><div class="bar-track"><div class="bar-fill" style="width:${(pending/total)*100}%;background:linear-gradient(90deg,#7a5a12,var(--warn));"></div></div><div class="bar-val">${pending}</div></div>
      <div class="bar-row"><div class="bar-label">رد شده</div><div class="bar-track"><div class="bar-fill" style="width:${(rejected/total)*100}%;background:linear-gradient(90deg,#7a1c33,var(--danger));"></div></div><div class="bar-val">${rejected}</div></div>
    </div>
    <div class="card">
      <h3 style="margin-bottom:16px;">توزیع رتبه اعضا</h3>
      ${Object.keys(rankCounts).length ? Object.entries(rankCounts).map(([rank,count])=>`
        <div class="bar-row"><div class="bar-label">${esc(rank)}</div><div class="bar-track"><div class="bar-fill" style="width:${(count/maxRank)*100}%;"></div></div><div class="bar-val">${count}</div></div>
      `).join("") : `<div class="empty-state" style="padding:20px;">عضوی ثبت نشده.</div>`}
    </div>
  </div>`;
}

function currentView(){
  switch(STATE.route){
    case "home": return viewHome();
    case "rules": return viewRules();
    case "members": return viewMembers();
    case "announcements": return viewAnnouncements();
    case "join": return viewJoin();
    case "login": return viewLogin();
    case "register": return viewRegister();
    case "profile": return viewProfile();
    case "tickets": return viewTickets();
    case "admin": return viewAdmin();
    default: return viewHome();
  }
}

function render(){
  const app = document.getElementById("app");
  if(!STATE.loaded){
    app.innerHTML = `<div class="center-hint"><div class="section-eyebrow">در حال بارگذاری Yanker...</div></div>`;
    return;
  }
  const isAdmin = STATE.route === "admin";
  app.innerHTML = `
    ${navBar()}
    ${STATE.banner && !STATE.user ? demoBanner() : ""}
    ${currentView()}
    ${!isAdmin ? footer() : (modalContent ? "" : footer())}
  `;
}
function demoBanner(){
  return `
  <div class="wrap">
    <div class="banner">
      <span>🔑 : نام کاربری <b>owner</b> و رمز عبور <b>Yanker@Admin#2026</b></span>
      <button class="btn btn-sm btn-ghost" onclick="STATE.banner=false;render()">متوجه شدم</button>
    </div>
  </div>`;
}

/* ---------- INIT ---------- */
(async function init(){
  render();
  await loadAll();
  render();
})();

  <button class="admin-close" onclick="closeEmbeddedAdmin()">✕ بستن پنل</button>
  <iframe id="embeddedAdminFrame" title="Yanker Admin Panel" style="display:none;width:100%;height:100%;border:0" src="/admin.html"></iframe>
</div>
<script>
window.openEmbeddedAdmin=function(){
  var o=document.getElementById("embeddedAdminOverlay");
  var frame=document.getElementById("embeddedAdminFrame");
  if(!o || !frame) return;

  // Direct access to the admin panel.
  // Admin password: Yanker@Admin#2026
  o.style.display="block";
  document.body.style.overflow="hidden";
  frame.style.display="block";
};

window.unlockEmbeddedAdmin=function(){
  // Kept for compatibility with older calls.
  window.openEmbeddedAdmin();
};
window.closeEmbeddedAdmin=function(){
  var o=document.getElementById("embeddedAdminOverlay");
  if(o) o.style.display="none";
  document.body.style.overflow="";
  var frame=document.getElementById("embeddedAdminFrame");
  if(frame) frame.style.display="none";
};
document.addEventListener("keydown",function(e){
  if(e.key==="Enter" && document.getElementById("embeddedAdminOverlay")?.style.display==="block"){
    unlockEmbeddedAdmin();
  }
});
</script>
